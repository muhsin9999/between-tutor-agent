services:
  - type: web
    name: between-telegram
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace channel
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: INTELLIGENCE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Signs the account-link token. It MUST be byte-identical to the value on
      # the dashboard's Vercel project: apps/dashboard mints `link_<token>` with
      # it and apps/channel/src/link.ts verifies with it. Absent, verifyLinkToken
      # returns null on its first check and EVERY tap is refused with "that link
      # is no longer valid" — which is what shipped, because this key was simply
      # missing from this file.
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL
        sync: false
      - key: MODEL_PROVIDER
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DEMO_SPEED
        value: "day:40s"
