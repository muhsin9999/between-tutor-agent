services:
  - type: web
    name: between-telegram
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace channel
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: INTELLIGENCE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL
        sync: false
      - key: MODEL_PROVIDER
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DEMO_SPEED
        value: "day:40s"
